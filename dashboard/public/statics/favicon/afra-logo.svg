<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- پس‌زمینه تیره و لوکس -->
    <radialGradient id="darkBg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#1f1f1f"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </radialGradient>

    <!-- سایه برای ایجاد عمق -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.8"/>
    </filter>

    <!-- گرادیانت لبه‌های ظریف برای جلوه متالیک تیره -->
    <linearGradient id="edgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#555555"/>
      <stop offset="100%" stop-color="#111111"/>
    </linearGradient>
  </defs>

  <!-- کادر پس‌زمینه با گوشه‌های گرد مخصوص PWA -->
  <rect width="512" height="512" rx="110" fill="url(#darkBg)"/>

  <!-- برگ افرای مشکی دقیق و استاندارد -->
  <g filter="url(#shadow)">
    <path d="M256,65 
             L292,130 L355,115 L335,175 L415,205 L350,255 L395,320 L315,310 L285,395 L256,335 L227,395 L197,310 L117,320 L162,255 L97,205 L177,175 L157,115 L220,130 Z 
             M256,335 L256,430" 
          fill="#141414" 
          stroke="url(#edgeGrad)" 
          stroke-width="3.5" 
          stroke-linejoin="round" 
          stroke-linecap="round"/>
  </g>
</svg>
